{% extends "base.html" %}
{% load static %}

{% block title %}Log Out · StudySync{% endblock %}
{% block page_title %}Log Out{% endblock %}

{% block content %}
<div class="card confirm-card">
    <div class="confirm-icon">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
        </svg>
    </div>
    <h2>Log out of StudySync?</h2>
    <p>You'll need to sign in again to access your subjects, plans and notes.</p>

    <form method="post">
        {% csrf_token %}
        <div class="flex" style="justify-content: center;">
            <a class="btn btn-secondary" href="{% url 'dashboard:dashboard' %}">Cancel</a>
            <button type="submit" class="btn btn-danger">Log Out</button>
        </div>
    </form>
</div>
{% endblock %}
